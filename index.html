<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F7F3F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Змейка">
<title>Змейка</title>
<style>
  :root {
    --bg: #F7F3F1;
    --text: #3D3032;
    --muted: #806F70;
    --dim: #A99595;
    --accent: #E88F91;
    --overlay: rgba(255, 250, 248, 0.94);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  .size { width: min(92vw, calc(100dvh - 230px), 560px); }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px; }
  header div { display: flex; flex-direction: column; }
  header .right { align-items: flex-end; }
  .label { font-size: 14px; color: var(--muted); }
  .value { font-size: 44px; font-weight: 600; line-height: 1.05; }
  #best { color: var(--accent); }
  .board { position: relative; aspect-ratio: 1; border-radius: 18px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; background: var(--overlay);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; gap: 10px;
  }
  #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 44px); font-weight: 600; }
  #overlay p { margin: 0; font-size: clamp(14px, 3.8vw, 18px); color: #806F70; white-space: pre-line; }
  #form { display: flex; gap: 8px; width: 100%; max-width: 360px; }
  #name {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: rgba(255,255,255,0.78); border: 1px solid #D8C7C5; border-radius: 999px;
    padding: 10px 16px; outline: none; user-select: text; -webkit-user-select: text;
  }
  #name:focus { border-color: var(--accent); }
  #playBtn { background: var(--accent); color: #FFFFFF; border: none; font-weight: 600; padding: 10px 22px; }
  #playBtn:active { background: #D9787D; }
  #lb {
    width: 100%; max-width: 360px; flex: 1; min-height: 0; overflow-y: auto;
    text-align: left; touch-action: pan-y;
  }
  .row { display: flex; gap: 8px; padding: 4px 10px; font-size: 15px; border-radius: 8px; }
  .row:nth-child(odd) { background: rgba(93,65,67,0.055); }
  .row .pos { width: 22px; color: var(--muted); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sc { font-variant-numeric: tabular-nums; }
  .row.me, .row.me .pos { color: var(--accent); }
  .lbempty { color: var(--dim); font-size: 14px; text-align: center; padding: 12px 0; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  button {
    font: inherit; font-size: 16px; color: var(--text);
    background: #EFE7E5; border: 1px solid #D8C7C5; border-radius: 999px;
    padding: 10px 28px; cursor: pointer;
  }
  button:active { background: #E5D7D5; }
  .hint { font-size: 13px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
  <header class="size">
    <div><span class="label">Счёт</span><span class="value" id="score">0</span></div>
    <div class="right"><span class="label">Рекорд</span><span class="value" id="best">0</span></div>
  </header>

  <div class="board size">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="ovTitle">Змейка</h1>
      <p id="ovSub">Введи имя и нажми «Играть»</p>
      <div id="form">
        <input id="name" type="text" maxlength="16" placeholder="Твоё имя" autocomplete="nickname" enterkeyhint="go">
        <button id="playBtn" type="button">Играть</button>
      </div>
      <div id="lb"></div>
    </div>
  </div>

  <footer class="size">
    <button id="pauseBtn" type="button">Пауза</button>
    <div class="hint">Свайпай по полю или используй стрелки / WASD. Пробел — пауза.</div>
  </footer>

<script>
(() => {
  const COLS = 20, ROWS = 20, CELL = 28, SIZE = COLS * CELL;
  const HEAD = [0xF0, 0xA0, 0xA0], TAIL = [0xB9, 0x72, 0x78], DEAD = [0x8D, 0x6A, 0x6B], DEAD_TAIL = [0x5A, 0x46, 0x49];
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);

  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), overlay = $('overlay');
  const ovTitle = $('ovTitle'), ovSub = $('ovSub'), pauseBtn = $('pauseBtn');
  const nameEl = $('name'), playBtn = $('playBtn'), formEl = $('form'), lbEl = $('lb');

  // ---------- Рейтинг (Supabase) ----------
  const SB_URL = 'https://zdvkdleeiuopjtjutaum.supabase.co';
  const SB_KEY = 'sb_publishable_5U__4qiFa4e_Jh3biQ3TQw_4HHeQpBk';
  const HEADERS = { apikey: SB_KEY, 'Content-Type': 'application/json' };
  let table = null, pending = 0;

  try { nameEl.value = localStorage.getItem('snake-name') || ''; } catch (e) {}
  nameEl.addEventListener('input', () => {
    try { localStorage.setItem('snake-name', playerName()); } catch (e) {}
  });

  function playerName() { return nameEl.value.trim().replace(/\s+/g, ' '); }
  const sameName = (a, b) => a.toLowerCase() === b.toLowerCase();

  function renderTable(message) {
    lbEl.textContent = '';
    const note = text => {
      const d = document.createElement('div');
      d.className = 'lbempty'; d.textContent = text; lbEl.appendChild(d);
    };
    if (message) return note(message);
    if (!table || !table.length) return note('Пока никого нет — стань первым!');

    const me = playerName();
    table.slice(0, 100).forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (me && sameName(r.name, me) ? ' me' : '');
      for (const [cls, text] of [['pos', i + 1], ['nm', r.name], ['sc', r.score]]) {
        const c = document.createElement('span');
        c.className = cls; c.textContent = text; row.appendChild(c);
      }
      lbEl.appendChild(row);
    });
  }

  async function loadTable() {
    try {
      const r = await fetch(SB_URL + '/rest/v1/scores?select=name,score&order=score.desc&limit=300', { headers: HEADERS });
      if (!r.ok) throw new Error(r.status);
      const seen = new Set();
      table = (await r.json()).filter(d => {
        const k = d.name.trim().toLowerCase();
        if (seen.has(k)) return false;
        seen.add(k); return true;
      });
      renderTable();
    } catch (e) {
      table = null; renderTable('Рейтинг пока недоступен');
    }
  }

  async function trySubmit() {
    const n = playerName();
    if (pending <= 0 || !n) return;
    const sc = pending; pending = 0;
    const mine = table && table.find(d => sameName(d.name, n));
    if (mine && mine.score >= sc) return;
    try {
      await fetch(SB_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: { ...HEADERS, Prefer: 'return=minimal' },
        body: JSON.stringify({ name: n, score: sc })
      });
    } catch (e) {}
    loadTable();
  }

  let snake, dir, inputs, food, score, best = 0, state = 'ready', interval, acc = 0, last = 0, dead = false, newRecord = false;

  try { best = parseInt(localStorage.getItem('snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    const cx = COLS / 2, cy = ROWS / 2;
    snake = [[cx, cy], [cx - 1, cy], [cx - 2, cy]];
    dir = DIRS.right; inputs = []; score = 0; interval = 140; acc = 0;
    dead = false; newRecord = false;
    placeFood(); scoreEl.textContent = 0;
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!snake.some(s => s[0] === x && s[1] === y)) free.push([x, y]);
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function showOverlay(title, sub, full) {
    ovTitle.textContent = title; ovSub.textContent = sub;
    formEl.style.display = full ? 'flex' : 'none';
    lbEl.style.display = full ? 'block' : 'none';
    overlay.style.display = 'flex';
  }

  function start() {
    trySubmit();
    nameEl.blur();
    reset(); state = 'running';
    overlay.style.display = 'none';
    pauseBtn.textContent = 'Пауза';
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused'; showOverlay('Пауза', 'Нажми, чтобы продолжить');
      pauseBtn.textContent = 'Продолжить';
    } else if (state === 'paused') {
      state = 'running'; overlay.style.display = 'none';
      pauseBtn.textContent = 'Пауза';
    } else {
      start();
    }
  }

  function turn(d) {
    if (state !== 'running') return;
    const prev = inputs.length ? inputs[inputs.length - 1] : dir;
    const opposite = d[0] === -prev[0] && d[1] === -prev[1];
    const same = d[0] === prev[0] && d[1] === prev[1];
    if (!same && !opposite && inputs.length < 3) inputs.push(d);
  }

  function step() {
    if (inputs.length) dir = inputs.shift();
    const head = snake[0];
    const nx = head[0] + dir[0], ny = head[1] + dir[1];
    const eats = food && nx === food[0] && ny === food[1];
    const limit = eats ? snake.length : snake.length - 1;

    let hit = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
    for (let i = 0; !hit && i < limit; i++)
      if (snake[i][0] === nx && snake[i][1] === ny) hit = true;
    if (hit) return gameOver(false);

    snake.unshift([nx, ny]);
    if (eats) {
      score += 10; scoreEl.textContent = score;
      interval = Math.max(60, 140 - Math.floor(score / 10) * 3);
      if (snake.length >= COLS * ROWS) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver(won) {
    state = 'over'; dead = !won;
    if (score > best) {
      best = score; newRecord = score > 0;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    if (navigator.vibrate && !won) navigator.vibrate(120);
    pending = score;
    const hint = playerName() ? '' : '\nВведи имя, чтобы попасть в рейтинг';
    showOverlay(won ? 'Победа!' : 'Игра окончена',
      (newRecord ? 'Новый рекорд: ' + score : 'Счёт: ' + score) + hint, true);
    pauseBtn.textContent = 'Заново';
    trySubmit();
  }

  // ---------- Отрисовка ----------
  const lerp = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  }

  function draw(time) {
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        ctx.fillStyle = (x + y) % 2 ? '#F1E9E7' : '#E9DEDC';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }

    if (food) {
      const r = 9 + Math.sin(time / 250);
      const fx = food[0] * CELL + CELL / 2, fy = food[1] * CELL + CELL / 2;
      const g = ctx.createRadialGradient(fx - 3, fy - 4, 1, fx, fy, r);
      g.addColorStop(0, '#F7B5B2'); g.addColorStop(1, '#D9787D');
      ctx.save();
      ctx.shadowColor = 'rgba(217,120,125,0.45)'; ctx.shadowBlur = 18;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    const n = snake.length;
    const hc = dead ? DEAD : HEAD, tc = dead ? DEAD_TAIL : TAIL;
    for (let i = n - 1; i >= 0; i--) {
      ctx.fillStyle = lerp(hc, tc, n > 1 ? i / (n - 1) : 0);
      rr(snake[i][0] * CELL + 1.5, snake[i][1] * CELL + 1.5, CELL - 3, CELL - 3, i === 0 ? 10 : 7);
      ctx.fill();
    }

    // Глаза
    const cx = snake[0][0] * CELL + CELL / 2, cy = snake[0][1] * CELL + CELL / 2;
    const px = -dir[1], py = dir[0];
    for (const side of [-1, 1]) {
      const ex = cx + dir[0] * 4 + px * side * 6, ey = cy + dir[1] * 4 + py * side * 6;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#806F70'; ctx.beginPath(); ctx.arc(ex + dir[0] * 1.2, ey + dir[1] * 1.2, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  function loop(time) {
    const dt = time - last; last = time;
    if (state === 'running') {
      acc += Math.min(dt, 100);
      while (acc >= interval && state === 'running') { acc -= interval; step(); }
    }
    draw(time);
    requestAnimationFrame(loop);
  }

  // ---------- Ввод ----------
  const keys = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right'
  };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') {
      if (e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); playBtn.click(); }
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); togglePause(); return; }
    if (keys[e.code]) { e.preventDefault(); turn(DIRS[keys[e.code]]); }
  });

  let tx = 0, ty = 0;
  document.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.target.closest && e.target.closest('#lb')) return;
    e.preventDefault();
    const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up));
    tx = t.clientX; ty = t.clientY;
  }, { passive: false });

  overlay.addEventListener('click', () => { if (state === 'paused') togglePause(); });
  playBtn.addEventListener('click', () => { if (state === 'ready' || state === 'over') start(); });
  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'over') start(); else togglePause();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'running') togglePause(); });

  reset();
  showOverlay('Змейка', 'Введи имя и нажми «Играть»', true);
  loadTable();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
