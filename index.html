<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D3EDB5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Змейка">
<title>Змейка</title>
<style>
  :root {
    --bg1: #E8F6D4;
    --bg2: #C8E6A5;
    --text: #1E3A26;
    --muted: #46634E;
    --dim: #3F5C47;
    --accent: #B4500A;
    --primary: #2E7D32;
    --primary-dark: #1F5F24;
    --line: #A7C98A;
    --surface: #FFFFFF;
    --overlay: rgba(246, 251, 240, 0.86);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--bg2);
    background-image: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  .size { width: min(92vw, calc(100dvh - 230px), 560px); }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px; }
  header div { display: flex; flex-direction: column; }
  header .right { align-items: flex-end; }
  .label { font-size: 14px; color: var(--muted); }
  .value { font-size: 44px; font-weight: 600; line-height: 1.05; }
  #best { color: var(--accent); }
  .board {
    position: relative; aspect-ratio: 1; overflow: hidden;
    box-shadow: 0 12px 32px rgba(31, 70, 35, 0.25), 0 0 0 1px rgba(31, 70, 35, 0.12);
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; background: var(--overlay);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; gap: 10px;
  }
  #mascot {
    width: clamp(64px, 18vw, 96px); height: clamp(64px, 18vw, 96px); flex-shrink: 0;
    object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(31, 70, 35, 0.3);
  }
  #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 44px); font-weight: 600; }
  #overlay p { margin: 0; font-size: clamp(14px, 3.8vw, 18px); color: var(--muted); white-space: pre-line; }
  #form { display: flex; gap: 8px; width: 100%; max-width: 360px; }
  #name {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px; outline: none; user-select: text; -webkit-user-select: text;
  }
  #name::placeholder { color: #7E9784; }
  #name:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2); }
  #playBtn { background: var(--primary); color: #fff; border: none; font-weight: 600; padding: 10px 22px; }
  #playBtn:active { background: var(--primary-dark); }
  #lb {
    width: 100%; max-width: 360px; flex: 1; min-height: 0; overflow-y: auto;
    text-align: left; touch-action: pan-y;
  }
  .row { display: flex; gap: 8px; padding: 4px 10px; font-size: 15px; border-radius: 8px; }
  .row:nth-child(odd) { background: rgba(31, 70, 35, 0.07); }
  .row .pos { width: 22px; color: var(--muted); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sc { font-variant-numeric: tabular-nums; }
  .row.me { background: rgba(46, 125, 50, 0.16); color: var(--primary-dark); font-weight: 600; }
  .row.me .pos { color: var(--primary-dark); }
  .lbempty { color: var(--dim); font-size: 14px; text-align: center; padding: 12px 0; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  button {
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 28px; cursor: pointer;
  }
  button:active { background: #EAF5DC; }
  .hint { font-size: 13px; color: var(--dim); text-align: center; }
</style>
</head>

    if (message) return note(message);
    if (!table || !table.length) return note('Пока никого нет — стань первым!');

    const me = playerName();
    table.slice(0, 100).forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (me && sameName(r.name, me) ? ' me' : '');
      for (const [cls, text] of [['pos', i + 1], ['nm', r.name], ['sc', r.score]]) {
        const c = document.createElement('span');
        c.className = cls; c.textContent = text; row.appendChild(c);
      }
      lbEl.appendChild(row);
    });
  }

  async function loadTable() {
    try {
      const r = await fetch(SB_URL + '/rest/v1/scores?select=name,score&order=score.desc&limit=1000', { headers: HEADERS });
      if (!r.ok) throw new Error(r.status);
      const seen = new Set();
      table = (await r.json()).filter(d => {
        const k = d.name.trim().toLowerCase();
        if (seen.has(k)) return false;
        seen.add(k); return true;
      });
      renderTable();
    } catch (e) {
      table = null; renderTable('Рейтинг пока недоступен');
    }
  }

  async function trySubmit() {
    const n = playerName();
    if (pending <= 0 || !n) return;
    const sc = pending; pending = 0;
    const mine = table && table.find(d => sameName(d.name, n));
    if (mine && mine.score >= sc) return;
    try {
      await fetch(SB_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: { ...HEADERS, Prefer: 'return=minimal' },
        body: JSON.stringify({ name: n, score: sc })
      });
    } catch (e) {}
    loadTable();
  }

  let snake, dir, inputs, food, score, best = 0, state = 'ready', interval, acc = 0, last = 0, dead = false, newRecord = false;

  try { best = parseInt(localStorage.getItem('snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    const cx = COLS / 2, cy = ROWS / 2;
    snake = [[cx, cy], [cx - 1, cy], [cx - 2, cy]];
    dir = DIRS.right; inputs = []; score = 0; interval = 165; acc = 0;
    dead = false; newRecord = false;
    placeFood(); scoreEl.textContent = 0;
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!snake.some(s => s[0] === x && s[1] === y)) free.push([x, y]);
    if (!free.length) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
    // третий элемент — вид еды, четвёртый — цвет ягод
    food.push(['red', 'green', 'berry'][Math.floor(Math.random() * 3)], Math.floor(Math.random() * 2));
  }

  function showOverlay(title, sub, full) {
    ovTitle.textContent = title; ovSub.textContent = sub;
    formEl.style.display = full ? 'flex' : 'none';
    mascotEl.style.display = full ? 'block' : 'none';
    lbEl.style.display = full ? 'block' : 'none';
    overlay.style.display = 'flex';
  }

  function start() {
    trySubmit();
    nameEl.blur();
    paintMeadow();   // новая трава на каждую игру
    reset(); state = 'running';
    overlay.style.display = 'none';
    pauseBtn.textContent = 'Пауза';
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused'; showOverlay('Пауза', 'Нажми, чтобы продолжить');
      pauseBtn.textContent = 'Продолжить';
    } else if (state === 'paused') {
      state = 'running'; overlay.style.display = 'none';
      pauseBtn.textContent = 'Пауза';
    } else {
      start();
    }
  }

  function turn(d) {
    if (state !== 'running') return;
    const prev = inputs.length ? inputs[inputs.length - 1] : dir;
    const opposite = d[0] === -prev[0] && d[1] === -prev[1];
    const same = d[0] === prev[0] && d[1] === prev[1];
    if (!same && !opposite && inputs.length < 3) inputs.push(d);
  }

  function step() {
    if (inputs.length) dir = inputs.shift();
    const head = snake[0];
    const nx = head[0] + dir[0], ny = head[1] + dir[1];
    const eats = food && nx === food[0] && ny === food[1];
    const limit = eats ? snake.length : snake.length - 1;

    let hit = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
    for (let i = 0; !hit && i < limit; i++)
      if (snake[i][0] === nx && snake[i][1] === ny) hit = true;
    if (hit) return gameOver(false);

    snake.unshift([nx, ny]);
    if (eats) {
      score += 10; scoreEl.textContent = score;
      interval = Math.max(85, 165 - Math.floor(score / 10) * 2);
      if (snake.length >= COLS * ROWS) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver(won) {
    state = 'over'; dead = !won;
    if (score > best) {
      best = score; newRecord = score > 0;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    if (navigator.vibrate && !won) navigator.vibrate(120);
    pending = score;
    const hint = playerName() ? '' : '\nВведи имя, чтобы попасть в рейтинг';
    showOverlay(won ? 'Победа!' : 'Игра окончена',
      (newRecord ? 'Новый рекорд: ' + score : 'Счёт: ' + score) + hint, true);
    pauseBtn.textContent = 'Заново';
    trySubmit();
  }

  // ---------- Отрисовка ----------
  const lerp = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  }

  // ---------- Луг: рисуется один раз в отдельный холст ----------
  const meadow = document.createElement('canvas');
  meadow.width = meadow.height = SIZE * dpr;
  function paintMeadow() {
    const m = meadow.getContext('2d');
    m.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Новое зерно при каждой отрисовке: луг каждый раз получается другим
    let seed = (Math.random() * 4294967296) >>> 0;
    const rnd = () => {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const pick = a => a[Math.floor(rnd() * a.length)];
    const blade = (x, y, h, lean, color, w) => {
      m.strokeStyle = color; m.lineWidth = w; m.lineCap = 'round';
      m.beginPath(); m.moveTo(x, y);
      m.quadraticCurveTo(x + lean * 0.3, y - h * 0.6, x + lean, y - h);
      m.stroke();
    };

    // Основа: шахматка из двух светло-зелёных оттенков
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        m.fillStyle = (x + y) % 2 ? '#A6D77A' : '#B6E18C';
        m.fillRect(x * CELL, y * CELL, CELL, CELL);
      }

    // Пятна света и тени, чтобы поле не выглядело плоским
    for (let i = 0; i < 700; i++) {
      m.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(40,110,30,0.08)';
      m.beginPath();
      m.ellipse(rnd() * SIZE, rnd() * SIZE, 3 + rnd() * 7, 2 + rnd() * 5, rnd() * Math.PI, 0, Math.PI * 2);
      m.fill();
    }

    // Травинки: мелкие, по две на клетку
    const greens = ['#6FB04A', '#86C45C', '#5E9E3E', '#9AD46E'];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        for (let k = 0; k < 2; k++)
          blade(x * CELL + rnd() * CELL, y * CELL + 6 + rnd() * (CELL - 6), 3 + rnd() * 4, (rnd() - 0.5) * 4, pick(greens), 1);

    // Прорисованные кустики травы в духе чернильных зарисовок
    const INK = '#2C5E27', INK2 = '#3F7A34', RIB = 'rgba(214,240,170,0.8)';

    // Заострённый лист: заливка и тонкая светлая жилка
    const leaf = (x, y, h, lean, w, color, rib) => {
      const tx = x + lean, ty = y - h;
      const cx = x + lean * 0.35, cy = y - h * 0.6;
      m.fillStyle = color;
      m.beginPath();
      m.moveTo(x - w / 2, y);
      m.quadraticCurveTo(cx - w * 0.9, cy, tx, ty);
      m.quadraticCurveTo(cx + w * 0.9, cy, x + w / 2, y);
      m.closePath(); m.fill();
      if (rib) {
        m.strokeStyle = RIB; m.lineWidth = 0.6; m.lineCap = 'round';
        m.beginPath(); m.moveTo(x, y - 1);
        m.quadraticCurveTo(cx, cy, x + lean * 0.85, y - h * 0.85); m.stroke();
      }
    };

    // Тонкий стебель с колоском и остями
    const ear = (x, y, h, lean) => {
      const tx = x + lean, ty = y - h;
      m.strokeStyle = INK; m.lineWidth = 0.9; m.lineCap = 'round';
      m.beginPath(); m.moveTo(x, y);
      m.quadraticCurveTo(x + lean * 0.2, y - h * 0.6, tx, ty + 4); m.stroke();
      m.save();
      m.translate(tx, ty + 2); m.rotate(Math.atan2(lean, h));
      m.fillStyle = INK;
      m.beginPath(); m.ellipse(0, 0, 1.7, 4.2, 0, 0, Math.PI * 2); m.fill();
      m.lineWidth = 0.5;
      for (const k of [-1, 1]) {
        m.beginPath(); m.moveTo(k * 1.2, 1); m.lineTo(k * 2.6, -2.4); m.stroke();
      }
      m.restore();
    };

    // Стебелёк с «звёздочкой» на конце
    const sprig = (x, y, h, lean) => {
      const tx = x + lean, ty = y - h;
      m.strokeStyle = INK; m.lineWidth = 0.8; m.lineCap = 'round';
      m.beginPath(); m.moveTo(x, y);
      m.quadraticCurveTo(x + lean * 0.2, y - h * 0.6, tx, ty); m.stroke();
      m.lineWidth = 0.7;
      for (let a = 0; a < 5; a++) {
        const ang = -Math.PI / 2 + (a - 2) * 0.55;
        m.beginPath(); m.moveTo(tx, ty);
        m.lineTo(tx + Math.cos(ang) * 3.4, ty + Math.sin(ang) * 3.4); m.stroke();
      }
      m.fillStyle = INK; m.beginPath(); m.arc(tx, ty, 0.9, 0, Math.PI * 2); m.fill();
    };

    const tuft = (x, y, s, type) => {
      m.fillStyle = 'rgba(30,90,30,0.22)';
      m.beginPath(); m.ellipse(x, y + 1, 9 * s, 2.6 * s, 0, 0, Math.PI * 2); m.fill();

      if (type === 0) {            // высокий пучок с колосьями
        for (let i = 0; i < 7; i++) {
          const a = (i - 3) / 3;
          leaf(x + a * 2, y, (12 + rnd() * 8) * s, a * 9 * s + (rnd() - 0.5) * 2, 2.2 * s, i % 2 ? INK : INK2, false);
        }
        ear(x - 1, y, 27 * s, -5 * s);
        ear(x + 1, y, 21 * s, 8 * s);
      } else if (type === 1) {     // розетка из широких листьев
        for (let i = 0; i < 6; i++) {
          const a = -1 + i * 0.4;
          leaf(x + a * 1.5, y, (10 + rnd() * 4) * s, a * 13 * s, 4 * s, i % 2 ? INK : INK2, true);
        }
      } else if (type === 2) {     // низкая кочка с цветочками
        for (let i = 0; i < 9; i++) {
          const a = (i - 4) / 4;
          leaf(x + a * 5, y, (6 + rnd() * 5) * s, a * 6 * s, 1.7 * s, i % 2 ? INK : INK2, false);
        }
        sprig(x - 3, y, 17 * s, -7 * s);
        sprig(x + 1, y, 20 * s, 2 * s);
        sprig(x + 4, y, 15 * s, 8 * s);
      } else {                     // лёгкий пучок тонких листьев
        for (let i = 0; i < 5; i++) {
          const a = (i - 2) / 2;
          leaf(x + a * 2, y, (14 + rnd() * 6) * s, a * 11 * s, 1.5 * s, INK2, false);
        }
        ear(x, y, 20 * s, 7 * s);
      }
    };

    // Кустики раскиданы случайно; нижние рисуются поверх верхних
    const tufts = [];
    for (let i = 0; i < 56; i++)
      tufts.push([12 + rnd() * (SIZE - 24), 24 + rnd() * (SIZE - 26), 0.8 + rnd() * 0.35, i % 4]);
    tufts.sort((a, b) => a[1] - b[1]).forEach(t => tuft(t[0], t[1], t[2], t[3]));
  }
  paintMeadow();

  // ---------- Еда: красные и зелёные яблоки, ягодки ----------
  const APPLE_RED = { light: '#FF9A8A', mid: '#E02B2B', dark: '#9E1218', glow: 'rgba(255,70,60,0.55)', leaf: '#3FA34D' };
  const APPLE_GREEN = { light: '#EFFF9E', mid: '#9BD83F', dark: '#4F9A22', glow: 'rgba(160,230,60,0.6)', leaf: '#2E8B3F' };
  const BERRIES = [
    { light: '#B9A4FF', mid: '#6A4CD6', dark: '#35238F', glow: 'rgba(110,80,230,0.5)' },  // черника
    { light: '#FF9DBB', mid: '#E0305F', dark: '#98193F', glow: 'rgba(230,50,100,0.5)' }   // малина
  ];

  function drawApple(fx, fy, r, c) {
    ctx.fillStyle = 'rgba(30,80,20,0.28)';
    ctx.beginPath(); ctx.ellipse(fx, fy + r - 1, r * 0.85, 3, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.shadowColor = c.glow; ctx.shadowBlur = 10;
    const g = ctx.createRadialGradient(fx - 3, fy - 3, 1, fx, fy, r);
    g.addColorStop(0, c.light); g.addColorStop(0.55, c.mid); g.addColorStop(1, c.dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(30,50,15,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.ellipse(fx - 3.5, fy - 4, 2.6, 1.6, -0.6, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#6B4423'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx, fy - r + 1);
    ctx.quadraticCurveTo(fx + 1, fy - r - 2, fx + 2.5, fy - r - 4); ctx.stroke();
    ctx.fillStyle = c.leaf;
    ctx.beginPath(); ctx.ellipse(fx + 5, fy - r - 2, 4.2, 2.2, -0.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawBerries(fx, fy, pulse, variant) {
    const c = BERRIES[variant % BERRIES.length];
    const r = 5.4 + pulse * 0.5;

    ctx.fillStyle = 'rgba(30,80,20,0.28)';
    ctx.beginPath(); ctx.ellipse(fx, fy + 9, 10, 3, 0, 0, Math.PI * 2); ctx.fill();

    // Верхняя ягода рисуется первой, две нижние перекрывают её
    for (const [dx, dy] of [[0, -4.5], [-4.8, 3], [4.8, 3]]) {
      const bx = fx + dx, by = fy + dy;
      ctx.save();
      ctx.shadowColor = c.glow; ctx.shadowBlur = 8;
      const g = ctx.createRadialGradient(bx - 1.8, by - 2, 0.5, bx, by, r);
      g.addColorStop(0, c.light); g.addColorStop(0.55, c.mid); g.addColorStop(1, c.dark);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(30,20,50,0.4)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(bx - 1.8, by - 2, 1.2, 0, Math.PI * 2); ctx.fill();
    }

    // Веточка и листик
    ctx.strokeStyle = '#5E8F2E'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx, fy - 9); ctx.quadraticCurveTo(fx + 1, fy - 12, fx + 3, fy - 13); ctx.stroke();
    ctx.fillStyle = '#3FA34D';
    ctx.beginPath(); ctx.ellipse(fx + 6, fy - 12, 3.8, 2, -0.4, 0, Math.PI * 2); ctx.fill();
  }

  function draw(time) {
    ctx.drawImage(meadow, 0, 0, SIZE, SIZE);

    // Еда: вид выбирается случайно при появлении
    if (food) {
      const fx = food[0] * CELL + CELL / 2, fy = food[1] * CELL + CELL / 2 + 1;
      const pulse = Math.sin(time / 250) * 0.6;
      if (food[2] === 'berry') drawBerries(fx, fy, pulse, food[3]);
      else drawApple(fx, fy, 9 + pulse, food[2] === 'red' ? APPLE_RED : APPLE_GREEN);
    }

    // Змейка: светлая голова, тёмный хвост, тонкий контур и мягкая тень
    const n = snake.length;
    const hc = dead ? DEAD : HEAD, tc = dead ? DEAD_TAIL : TAIL;
    ctx.save();
    ctx.shadowColor = 'rgba(20,60,20,0.25)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = dead ? 'rgba(90,20,30,0.6)' : 'rgba(20,80,35,0.65)';
    for (let i = n - 1; i >= 0; i--) {
      ctx.fillStyle = lerp(hc, tc, n > 1 ? i / (n - 1) : 0);
      rr(snake[i][0] * CELL + 1.5, snake[i][1] * CELL + 1.5, CELL - 3, CELL - 3, i === 0 ? 10 : 7);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();

    // Глаза
    const cx = snake[0][0] * CELL + CELL / 2, cy = snake[0][1] * CELL + CELL / 2;
    const px = -dir[1], py = dir[0];
    for (const side of [-1, 1]) {
      const ex = cx + dir[0] * 4 + px * side * 6, ey = cy + dir[1] * 4 + py * side * 6;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#17203F'; ctx.beginPath(); ctx.arc(ex + dir[0] * 1.2, ey + dir[1] * 1.2, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  function loop(time) {
    const dt = time - last; last = time;
    if (state === 'running') {
      acc += Math.min(dt, 100);
      while (acc >= interval && state === 'running') { acc -= interval; step(); }
    }
    draw(time);
    requestAnimationFrame(loop);
  }

  // ---------- Ввод ----------
  const keys = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right'
  };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') {
      if (e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); playBtn.click(); }
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); togglePause(); return; }
    if (keys[e.code]) { e.preventDefault(); turn(DIRS[keys[e.code]]); }
  });

  let tx = 0, ty = 0;
  document.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.target.closest && e.target.closest('#lb')) return;
    e.preventDefault();
    const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up));
    tx = t.clientX; ty = t.clientY;
  }, { passive: false });

  overlay.addEventListener('click', () => { if (state === 'paused') togglePause(); });
  playBtn.addEventListener('click', () => { if (state === 'ready' || state === 'over') start(); });
  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'over') start(); else togglePause();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'running') togglePause(); });

  reset();
  showOverlay('Змейка', 'Введи имя и нажми «Играть»', true);
  loadTable();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
